name = "transpose_lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Graded", "Tests", "Examples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "Graded"

[[lean_lib]]
name = "Tests"

[[lean_lib]]
name = "Examples"
