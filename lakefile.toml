name = "transpose_lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Graded", "Tests", "Examples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Mathlib's standard lint set assumes files destined for Mathlib itself.
# Three of its rules do not apply to this project and are turned off:
#   style.header  - wants a Mathlib copyright block in every file
#   hashCommand   - forbids `#guard`/`#eval`, which docs/RULES.md requires
#                   in every test file so definitions are known to compute
#   dupNamespace  - flags `Graded.Graded`, the name the plan specifies
weak.linter.style.header = false
weak.linter.hashCommand = false
weak.linter.dupNamespace = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "Graded"

[[lean_lib]]
name = "Tests"

[[lean_lib]]
name = "Examples"
